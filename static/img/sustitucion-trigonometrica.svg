<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
<title id="title">Integración por sustitución trigonométrica</title>
<desc id="desc">Tres casos de sustitución trigonométrica y sus triángulos rectángulos asociados.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#0b2530" flood-opacity=".13"/></filter><style>.title{font:800 40px Georgia,serif; fill:#073f4c;} .subtitle{font:500 18px Arial,sans-serif; fill:#5f6e80;} .case{font:800 26px Arial,sans-serif; fill:#cf8b21;} .caseText{font:700 21px Georgia,serif; fill:#132238;} .math{font:700 22px Georgia,serif; fill:#132238;} .side{font:italic 700 21px Georgia,serif; fill:#073f4c;} .theta{font:italic 800 22px Georgia,serif; fill:#cf8b21;} .note{font:500 16px Arial,sans-serif; fill:#5f6e80;}</style></defs><rect width="1800" height="760" rx="30" fill="#f7fbfc"/><rect x="0" y="0" width="1800" height="18" fill="#0b5f73"/><text x="900" y="64" text-anchor="middle" class="title">INTEGRACIÓN POR SUSTITUCIÓN TRIGONOMÉTRICA</text><text x="900" y="96" text-anchor="middle" class="subtitle">Selecciona la sustitución según la forma del radical y construye el triángulo asociado</text>
<g filter="url(#shadow)"><rect x="45" y="125" width="545" height="590" rx="24" fill="#ffffff" stroke="#c9dce2" stroke-width="2"/></g><rect x="45" y="125" width="545" height="76" rx="24" fill="#e7f4f6"/><rect x="45" y="171" width="545" height="30" fill="#e7f4f6"/><text x="73" y="159" class="case">Caso 1.</text><text x="73" y="188" class="caseText">Si aparece √(a² − u²)</text><path d="M 115 450 L 490 450 L 490 330 Z" fill="#eef9fa" stroke="#0b5f73" stroke-width="5" stroke-linejoin="round"/><path d="M 465 450 L 465 425 L 490 425" fill="none" stroke="#cf8b21" stroke-width="4"/><path d="M 133 450 Q 146 416 175 402" fill="none" stroke="#cf8b21" stroke-width="3"/><text x="173" y="435" class="theta">θ</text><text x="302.5" y="483" text-anchor="middle" class="side">√(a² − u²)</text><text x="510" y="397.0" class="side">u</text><text x="310.5" y="373.0" text-anchor="middle" transform="rotate(-18 310.5 373.0)" class="side">a</text><line x1="75" y1="500" x2="560" y2="500" stroke="#dce9ed" stroke-width="2"/><text x="80" y="545" class="math">u = a·sen θ</text><text x="80" y="593" class="math">du = a·cos θ dθ</text><text x="80" y="641" class="math">√(a² − u²) = a·cos θ</text>
<g filter="url(#shadow)"><rect x="627" y="125" width="545" height="590" rx="24" fill="#ffffff" stroke="#c9dce2" stroke-width="2"/></g><rect x="627" y="125" width="545" height="76" rx="24" fill="#e7f4f6"/><rect x="627" y="171" width="545" height="30" fill="#e7f4f6"/><text x="655" y="159" class="case">Caso 2.</text><text x="655" y="188" class="caseText">Si aparece √(a² + u²)</text><path d="M 697 450 L 1072 450 L 1072 330 Z" fill="#eef9fa" stroke="#0b5f73" stroke-width="5" stroke-linejoin="round"/><path d="M 1047 450 L 1047 425 L 1072 425" fill="none" stroke="#cf8b21" stroke-width="4"/><path d="M 715 450 Q 728 416 757 402" fill="none" stroke="#cf8b21" stroke-width="3"/><text x="755" y="435" class="theta">θ</text><text x="884.5" y="483" text-anchor="middle" class="side">a</text><text x="1092" y="397.0" class="side">u</text><text x="892.5" y="373.0" text-anchor="middle" transform="rotate(-18 892.5 373.0)" class="side">√(a² + u²)</text><line x1="657" y1="500" x2="1142" y2="500" stroke="#dce9ed" stroke-width="2"/><text x="662" y="545" class="math">u = a·tan θ</text><text x="662" y="593" class="math">du = a·sec² θ dθ</text><text x="662" y="641" class="math">√(a² + u²) = a·sec θ</text>
<g filter="url(#shadow)"><rect x="1209" y="125" width="545" height="590" rx="24" fill="#ffffff" stroke="#c9dce2" stroke-width="2"/></g><rect x="1209" y="125" width="545" height="76" rx="24" fill="#e7f4f6"/><rect x="1209" y="171" width="545" height="30" fill="#e7f4f6"/><text x="1237" y="159" class="case">Caso 3.</text><text x="1237" y="188" class="caseText">Si aparece √(u² − a²)</text><path d="M 1279 450 L 1654 450 L 1654 330 Z" fill="#eef9fa" stroke="#0b5f73" stroke-width="5" stroke-linejoin="round"/><path d="M 1629 450 L 1629 425 L 1654 425" fill="none" stroke="#cf8b21" stroke-width="4"/><path d="M 1297 450 Q 1310 416 1339 402" fill="none" stroke="#cf8b21" stroke-width="3"/><text x="1337" y="435" class="theta">θ</text><text x="1466.5" y="483" text-anchor="middle" class="side">a</text><text x="1674" y="397.0" class="side">√(u² − a²)</text><text x="1474.5" y="373.0" text-anchor="middle" transform="rotate(-18 1474.5 373.0)" class="side">u</text><line x1="1239" y1="500" x2="1724" y2="500" stroke="#dce9ed" stroke-width="2"/><text x="1244" y="545" class="math">u = a·sec θ</text><text x="1244" y="593" class="math">du = a·sec θ·tan θ dθ</text><text x="1244" y="641" class="math">√(u² − a²) = a·tan θ</text>
<text x="900" y="742" text-anchor="middle" class="note">Suposición usual: a &gt; 0. El triángulo permite regresar de θ a la variable original.</text></svg>